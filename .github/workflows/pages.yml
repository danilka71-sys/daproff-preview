name: Публикация DAPROFF Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы
        uses: actions/checkout@v4
      - name: Настроить Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Подготовить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
